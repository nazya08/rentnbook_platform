{% extends "base.html" %}
{% load static %}
{% block title %}Оновлення профілю{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm p-4">
        <h1 class="mb-4 text-center">Оновлення профілю</h1>
        <form method="post" action="" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="row g-3">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="first_name" class="form-label">Ім'я</label>
                        <input
                            type="text"
                            id="first_name"
                            name="first_name"
                            class="form-control"
                            placeholder="Наприклад, Олександр"
                            value="{{ form.first_name.value|default:form.instance.first_name }}"
                            required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="last_name" class="form-label">Прізвище</label>
                        <input
                            type="text"
                            id="last_name"
                            name="last_name"
                            class="form-control"
                            placeholder="Наприклад, Шевченко"
                            value="{{ form.last_name.value|default:form.instance.last_name }}"
                            required>
                    </div>
                </div>
            </div>

            <div class="form-group mt-3">
                <label for="middle_name" class="form-label">По-батькові</label>
                <input
                    type="text"
                    id="middle_name"
                    name="middle_name"
                    class="form-control"
                    placeholder="Наприклад, Сергійович"
                    value="{{ form.middle_name.value|default:form.instance.middle_name }}">
            </div>

            <div class="form-group mt-3">
                <label for="telegram_name" class="form-label">Telegram</label>
                <input
                    type="text"
                    id="telegram_name"
                    name="telegram_name"
                    class="form-control"
                    placeholder="Введіть ваше ім'я в Telegram"
                    value="{{ form.telegram_name.value|default:form.instance.telegram_name }}">
            </div>

            <div class="form-group mt-3">
                <label for="profile_picture" class="form-label">Фотографія профілю</label>
                <input
                    type="file"
                    id="profile_picture"
                    name="profile_picture"
                    class="form-control"
                    accept="image/*">
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary w-50">Зберегти зміни</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
