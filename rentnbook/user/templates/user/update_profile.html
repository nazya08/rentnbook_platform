{% extends "base.html" %}
{% load static %}
{% block title %}Оновити Профіль{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">Оновити Профіль</h1>
    <form method="post" action="" enctype="multipart/form-data" class="mt-4">
        {% csrf_token %}

        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label for="first_name">Ім'я</label>
                    <input type="text" id="first_name" name="first_name" class="form-control" placeholder="Введіть ім'я" value="{{ form.first_name.value|default:form.instance.first_name }}" required>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label for="last_name">Прізвище</label>
                    <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Введіть прізвище" value="{{ form.last_name.value|default:form.instance.last_name }}" required>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="middle_name">По-батькові</label>
            <input type="text" id="middle_name" name="middle_name" class="form-control" placeholder="Введіть по-батькові" value="{{ form.middle_name.value|default:form.instance.middle_name }}">
        </div>

        <div class="form-group">
            <label for="telegram_name">Telegram</label>
            <input type="text" id="telegram_name" name="telegram_name" class="form-control" placeholder="Введіть ваш Telegram" value="{{ form.telegram_name.value|default:form.instance.telegram_name }}">
        </div>

        <div class="form-group">
            <label for="profile_picture">Фотографія профілю</label>
            <input type="file" id="profile_picture" name="profile_picture" class="form-control" placeholder="Фото Профілю" value="{{ form.profile_picture.value|default:form.instance.profile_picture }}">
        </div>

        <button type="submit" class="btn btn-primary mt-3">Зберегти зміни</button>
    </form>
</div>
{% endblock %}
